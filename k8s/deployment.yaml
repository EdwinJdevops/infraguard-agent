apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraguard-agent
  namespace: infraguard
  labels:
    app: infraguard-agent
    version: "0.2.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: infraguard-agent
  template:
    metadata:
      labels:
        app: infraguard-agent
        version: "0.2.0"
    spec:
      serviceAccountName: infraguard-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: infraguard-agent
        # Release gate: replace this tag with a scanned and signed image digest.
        image: ghcr.io/edwinjdevops/infraguard-agent:0.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: INFRAGUARD_ENVIRONMENT
          value: "production"
        - name: INFRAGUARD_DOCS_ENABLED
          value: "false"
        - name: INFRAGUARD_TERRAFORM_ROOT
          value: "/workspace/terraform"
        - name: INFRAGUARD_ALLOWED_SSH_CIDRS
          valueFrom:
            configMapKeyRef:
              name: infraguard-policy
              key: allowed-ssh-cidrs
        - name: INFRAGUARD_API_KEY
          valueFrom:
            secretKeyRef:
              name: infraguard-secrets
              key: api-key
        volumeMounts:
        - name: terraform-workspace
          mountPath: /workspace/terraform
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: terraform-workspace
        persistentVolumeClaim:
          claimName: infraguard-terraform-workspace
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: infraguard-service
  namespace: infraguard
spec:
  selector:
    app: infraguard-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
